name: Feature proposal
description: Propose a capability with an explicit authority boundary.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user workflow, not only the requested API.
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authority boundary
      description: Who owns origins, credentials, actions, approvals, profiles, budgets, and evidence retention?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: List deterministic tests and observable outputs.
    validations:
      required: true
