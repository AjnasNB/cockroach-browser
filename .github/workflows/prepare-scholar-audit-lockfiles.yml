name: Prepare Scholar audit lockfiles
on:
  push:
    branches:
      - chore/prepare-scholar-audit-lockfiles
  pull_request:
    branches:
      - docs/scholar-browser-paper-metadata
    paths:
      - .github/workflows/prepare-scholar-audit-lockfiles.yml
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare ${{ matrix.project }} lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Cockroach Browser
            repository: AjnasNB/cockroach-browser
            ref: docs/scholar-browser-paper-metadata
            targets: .:production
          - project: Maqam
            repository: AjnasNB/maqam
            ref: docs/scholar-maqam-paper-metadata
            targets: .:production demo/yc-dashboard:all integration-fixtures/google-adk-function-tool:all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Generate and audit lockfiles
        env:
          LOCK_TARGETS: ${{ matrix.targets }}
        shell: bash
        run: |
          set -eu
          failed=0
          printf "Source commit %s\n\n" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          for target in $LOCK_TARGETS; do
            prefix=${target%:*}
            scope=()
            if [[ ${target#*:} == production ]]; then scope=(--omit=dev); fi
            if ! npm --prefix "$prefix" audit fix --package-lock-only --ignore-scripts "${scope[@]}"; then
              printf "Audit fix reported remaining findings for %s\n" "$prefix"
            fi
            if ! npm --prefix "$prefix" audit "${scope[@]}"; then failed=1; fi
            lock="$prefix/package-lock.json"
            if ! git diff --quiet -- "$lock"; then
              printf "### %s\n\n" "$lock" >> "$GITHUB_STEP_SUMMARY"
              sha256sum "$lock" >> "$GITHUB_STEP_SUMMARY"
              printf "\n%s\n" "~~~" >> "$GITHUB_STEP_SUMMARY"
              base64 -w 120 "$lock" >> "$GITHUB_STEP_SUMMARY"
              printf "%s\n\n" "~~~" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          git diff --stat
          exit "$failed"
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 00e8196d9afdb6674786b6b966bc927b12559d9d
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the published benchmark on the patched source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $digest = "5b609fb46bc00da79e450fb0fbd34bd442e565b1394f4af95433e0b341078221"
          $urls = @(
            "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.1/obscura-x86_64-windows-no-render.zip"
            "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.1/obscura-x86_64-windows.zip"
          )
          $chosen = $null
          foreach ($url in $urls) {
            $name = Split-Path -Leaf $url
            $zip = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -Uri $url -OutFile $zip
            $folder = Join-Path $env:RUNNER_TEMP ($name -replace ".zip$", "")
            Expand-Archive -LiteralPath $zip -DestinationPath $folder
            foreach ($candidate in Get-ChildItem -LiteralPath $folder -Filter obscura.exe -File -Recurse) {
              $actual = (Get-FileHash -LiteralPath $candidate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "$name executable SHA-256: $actual"
              if ($actual -eq $digest) { $chosen = $candidate.FullName; break }
            }
            if ($chosen) { break }
          }
          if (!$chosen) { throw "Official Windows assets do not match the published benchmark executable" }
          foreach ($target in @(30, 25)) {
            $report = Join-Path $env:RUNNER_TEMP "obscura-audit-$target.json"
            & node scripts/benchmark-lightweight.mjs --executable $chosen --implementation obscura --sha256 $digest --resource-profile constrained --warmup 1 --iterations 20 --resource-samples 10 --resource-sample-interval-ms 25 --target-mib $target --output $report
            $status = $LASTEXITCODE
            if (!(Test-Path -LiteralPath $report)) { throw "No benchmark report at $target MiB" }
            $measured = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            $sha = (Get-FileHash -LiteralPath $report -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### $target MiB"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Exit $status. SHA-256 $sha. Passed $($measured.verdict.passed). Maximum $($measured.verdict.maxObservedBrowserTreeRssBytes) bytes."
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "~~~"
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($report))
            $lines = [regex]::Matches($encoded, ".{1,120}") | ForEach-Object Value
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $lines
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "~~~"
            if ($target -eq 30) { $firstStatus = $status }
          }
          exit $firstStatus
