services:
  browser:
    build:
      context: .
    image: cockroach-browser:0.4.1
    ports:
      - "127.0.0.1:43110:43111"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    shm_size: 512m
    volumes:
      - browser-data:/data
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: ${COCKROACH_BROWSER_CONTAINER_MEMORY_LIMIT:-2g}
          cpus: "${COCKROACH_BROWSER_CONTAINER_CPU_LIMIT:-2.0}"
          pids: ${COCKROACH_BROWSER_CONTAINER_PID_LIMIT:-256}

volumes:
  browser-data:
